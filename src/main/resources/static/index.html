<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选股助手</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --border: #e3e8ef;
            --text: #1f2937;
            --text-sub: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --up: #dc2626;
            --down: #16a34a;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text: #047857;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
            --info-bg: #eff6ff;
            --info-border: #bfdbfe;
            --info-text: #1d4ed8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px 48px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 22px;
        }

        header p {
            margin: 0 0 20px;
            color: var(--text-sub);
            font-size: 13px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 200px;
            min-width: 0;
        }

        .field label {
            font-size: 13px;
            color: var(--text-sub);
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            color: var(--text);
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }

        input:disabled {
            background: #f3f4f6;
            color: var(--text-sub);
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex: 0 0 auto;
        }

        button {
            padding: 9px 18px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 14px;
            cursor: pointer;
            transition: background-color .15s, border-color .15s, opacity .15s;
            white-space: nowrap;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:not(:disabled):hover { background: var(--primary-hover); }

        .btn-ghost {
            background: #fff;
            color: var(--text);
            border-color: var(--border);
        }

        .btn-ghost:not(:disabled):hover { background: #f9fafb; }

        .spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            margin-right: 6px;
            vertical-align: -2px;
            border: 2px solid rgba(255, 255, 255, .45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .feedback {
            display: none;
            padding: 11px 14px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 13px;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .feedback.show { display: block; }

        .feedback.info {
            background: var(--info-bg);
            border-color: var(--info-border);
            color: var(--info-text);
        }

        .feedback.success {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .feedback.error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .result-head h2 {
            margin: 0;
            font-size: 16px;
        }

        .result-head .meta {
            font-size: 12px;
            color: var(--text-sub);
        }

        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            background: #fafbfc;
        }

        tbody tr:hover { background: #f9fafb; }

        td.num { text-align: right; font-variant-numeric: tabular-nums; }

        .up { color: var(--up); }
        .down { color: var(--down); }

        .score {
            display: inline-block;
            min-width: 46px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--info-bg);
            color: var(--info-text);
            font-size: 12px;
            text-align: center;
        }

        .reason {
            white-space: normal;
            min-width: 180px;
            color: var(--text-sub);
            font-size: 13px;
        }

        .empty {
            padding: 32px 12px;
            text-align: center;
            color: var(--text-sub);
            font-size: 13px;
        }

        .skeleton {
            height: 14px;
            border-radius: 4px;
            background: linear-gradient(90deg, #eef1f5 25%, #e2e7ee 37%, #eef1f5 63%);
            background-size: 400% 100%;
            animation: shimmer 1.2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        @media (max-width: 640px) {
            body { padding: 16px 12px 32px; }
            .card { padding: 16px; }
            .field { flex: 1 1 100%; }
            .actions { width: 100%; }
            .actions button { flex: 1; }
            header h1 { font-size: 19px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>实时选股助手</h1>
        <p>输入股票代码，实时拉取行情（价格 / PE / PB / ROE）并按规则打分排序。</p>
    </header>

    <div class="card">
        <div class="form-row">
            <div class="field">
                <label for="codes">股票代码（逗号分隔，可多只）</label>
                <input id="codes" type="text"
                       placeholder="如 600519,000651,300750"
                       value="600519,000651,601318">
            </div>
            <div class="field">
                <label for="limit">返回条数</label>
                <input id="limit" type="number" min="1" max="100" step="1" value="5"
                       placeholder="请输入 1-100 之间的整数">
            </div>
            <div class="actions">
                <button id="submitBtn" class="btn-primary" type="button">实时选股</button>
                <button id="resetBtn" class="btn-ghost" type="button">重置</button>
            </div>
        </div>
    </div>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

    <div class="card">
        <div class="result-head">
            <h2>选股结果</h2>
            <span id="resultMeta" class="meta"></span>
        </div>
        <div id="resultBody" class="table-wrap">
            <div class="empty">尚未查询，点击「实时选股」获取结果。</div>
        </div>
    </div>
</div>

<script>
    (function () {
        var API = '/api/stocks/pick';

        var codesInput = document.getElementById('codes');
        var limitInput = document.getElementById('limit');
        var submitBtn = document.getElementById('submitBtn');
        var resetBtn = document.getElementById('resetBtn');
        var feedback = document.getElementById('feedback');
        var resultBody = document.getElementById('resultBody');
        var resultMeta = document.getElementById('resultMeta');

        var loading = false;

        function setFeedback(type, message) {
            feedback.className = 'feedback show ' + type;
            feedback.textContent = message;
        }

        function clearFeedback() {
            feedback.className = 'feedback';
            feedback.textContent = '';
        }

        function setLoading(value) {
            loading = value;
            submitBtn.disabled = value;
            resetBtn.disabled = value;
            codesInput.disabled = value;
            limitInput.disabled = value;
            submitBtn.innerHTML = value
                ? '<span class="spinner"></span>查询中…'
                : '实时选股';
        }

        function showSkeleton() {
            var rows = '';
            for (var i = 0; i < 3; i++) {
                rows += '<tr><td colspan="9"><div class="skeleton"></div></td></tr>';
            }
            resultBody.innerHTML = '<table><tbody>' + rows + '</tbody></table>';
            resultMeta.textContent = '';
        }

        function showEmpty(message) {
            resultBody.innerHTML = '<div class="empty">' + message + '</div>';
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function fmt(value, digits) {
            return Number(value).toFixed(digits === undefined ? 2 : digits);
        }

        function renderRows(list) {
            var html = '<table><thead><tr>'
                + '<th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th>'
                + '<th>PE</th><th>PB</th><th>ROE(%)</th><th>数据状态</th><th>评分 / 理由</th>'
                + '</tr></thead><tbody>';

            list.forEach(function (item) {
                var s = item.stock || {};
                var change = Number(s.changePercent);
                var changeClass = change > 0 ? 'up' : (change < 0 ? 'down' : '');
                var sign = change > 0 ? '+' : '';
                var meta = Number(s.roe) > 0 ? '实时' : '实时(无ROE)';

                html += '<tr>'
                    + '<td>' + escapeHtml(s.code) + '</td>'
                    + '<td>' + escapeHtml(s.name) + '</td>'
                    + '<td class="num">' + fmt(s.price) + '</td>'
                    + '<td class="num ' + changeClass + '">' + sign + fmt(change) + '%</td>'
                    + '<td class="num">' + fmt(s.pe) + '</td>'
                    + '<td class="num">' + fmt(s.pb) + '</td>'
                    + '<td class="num">' + fmt(s.roe) + '</td>'
                    + '<td>' + escapeHtml(meta) + '</td>'
                    + '<td class="reason"><span class="score">' + fmt(item.score)
                    + '</span> ' + escapeHtml(item.reason) + '</td>'
                    + '</tr>';
            });

            html += '</tbody></table>';
            resultBody.innerHTML = html;
        }

        function validate() {
            var rawLimit = limitInput.value.trim();
            var rawCodes = codesInput.value.trim();
            if (rawCodes === '') {
                return { ok: false, message: '请输入至少一个股票代码。' };
            }
            var codeList = rawCodes.split(/[,，\s]+/).filter(Boolean);
            var bad = codeList.filter(function (c) {
                return !/^\d{6}$/.test(c);
            });
            if (bad.length > 0) {
                return { ok: false, message: '以下代码无效（需 6 位数字）：' + bad.join('、') };
            }
            if (rawLimit === '') {
                return { ok: false, message: '请输入返回条数。' };
            }
            var limit = Number(rawLimit);
            if (!Number.isInteger(limit) || limit < 1 || limit > 100) {
                return { ok: false, message: '返回条数需为 1-100 之间的整数。' };
            }
            return { ok: true, limit: limit, codes: codeList };
        }

        function submit() {
            if (loading) {
                return;
            }

            var check = validate();
            if (!check.ok) {
                setFeedback('error', check.message);
                return;
            }

            setLoading(true);
            clearFeedback();
            setFeedback('info', '正在拉取实时行情并打分…');
            showSkeleton();

            var query = 'limit=' + encodeURIComponent(check.limit)
                + '&codes=' + encodeURIComponent(check.codes.join(','));

            fetch(API + '?' + query)
                .then(function (res) {
                    if (!res.ok) {
                        throw new Error('服务返回异常状态：HTTP ' + res.status);
                    }
                    return res.json();
                })
                .then(function (data) {
                    if (!Array.isArray(data)) {
                        throw new Error('返回数据格式不符合预期。');
                    }

                    var now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                    if (data.length === 0) {
                        showEmpty('未获取到行情数据，请检查股票代码是否有效。');
                        resultMeta.textContent = '查询时间 ' + now;
                        setFeedback('info', '接口未返回有效行情数据。');
                        return;
                    }

                    renderRows(data);
                    resultMeta.textContent = '共 ' + data.length + ' 只 · 查询时间 ' + now;
                    setFeedback('success', '实时查询成功，共返回 ' + data.length + ' 只股票。');
                })
                .catch(function (err) {
                    showEmpty('查询失败，请稍后重试。');
                    resultMeta.textContent = '';
                    setFeedback('error', '查询失败：' + (err && err.message ? err.message : '未知错误'));
                })
                .finally(function () {
                    setLoading(false);
                });
        }

        function reset() {
            if (loading) {
                return;
            }
            codesInput.value = '600519,000651,601318';
            limitInput.value = '5';
            clearFeedback();
            resultMeta.textContent = '';
            showEmpty('尚未查询，点击「实时选股」获取结果。');
            codesInput.focus();
        }

        submitBtn.addEventListener('click', submit);
        resetBtn.addEventListener('click', reset);

        codesInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                submit();
            }
        });
        limitInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                submit();
            }
        });
    })();
</script>
</body>
</html>
