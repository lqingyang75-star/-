<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选股助手</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --bg-deep: #e9edf6;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-sub: #64748b;
            --primary: #0f766e;
            --primary-hover: #0d5f59;
            --primary-grad: linear-gradient(135deg, #0f766e, #0ea5a4);
            --primary-soft: #f0fdfa;
            --up: #e11d48;
            --down: #16a34a;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text: #047857;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
            --info-bg: #eff6ff;
            --info-border: #bfdbfe;
            --info-text: #1d4ed8;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, .08);
            --radius: 14px;
            --stripe: #fafbfd;
            --head-bg: #f8fafc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --bg-deep: #0b1220;
                --card: #1e293b;
                --border: #334155;
                --text: #e2e8f0;
                --text-sub: #94a3b8;
                --primary: #2dd4bf;
                --primary-hover: #5eead4;
                --primary-grad: linear-gradient(135deg, #0f766e, #14b8a6);
                --primary-soft: rgba(45, 212, 191, .12);
                --success-bg: rgba(16, 185, 129, .14);
                --success-border: rgba(16, 185, 129, .4);
                --success-text: #6ee7b7;
                --error-bg: rgba(244, 63, 94, .14);
                --error-border: rgba(244, 63, 94, .4);
                --error-text: #fda4af;
                --info-bg: rgba(59, 130, 246, .14);
                --info-border: rgba(59, 130, 246, .4);
                --info-text: #93c5fd;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
                --shadow-md: 0 6px 20px rgba(0, 0, 0, .4);
                --stripe: #223047;
                --head-bg: #273449;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px 48px;
            background: linear-gradient(180deg, var(--bg-deep), var(--bg) 320px);
            background-attachment: fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 24px;
            letter-spacing: .5px;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin: 0 0 20px;
            color: var(--text-sub);
            font-size: 13px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 200px;
            min-width: 0;
        }

        .field label {
            font-size: 13px;
            color: var(--text-sub);
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            background: var(--card);
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, .14);
        }

        input:disabled {
            background: #f3f4f6;
            color: var(--text-sub);
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex: 0 0 auto;
        }

        button {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 14px;
            cursor: pointer;
            transition: transform .12s, background-color .15s, border-color .15s,
                box-shadow .15s, opacity .15s;
            white-space: nowrap;
        }

        button:active:not(:disabled) { transform: translateY(1px); }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary-grad);
            color: #fff;
            box-shadow: 0 2px 6px rgba(15, 118, 110, .3);
        }

        .btn-primary:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(15, 118, 110, .35);
            filter: brightness(1.06);
        }

        .btn-ghost {
            background: var(--card);
            color: var(--text);
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
        }

        .btn-ghost:not(:disabled):hover {
            background: var(--primary-soft);
            border-color: var(--primary);
            color: var(--primary);
        }

        .spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            margin-right: 6px;
            vertical-align: -2px;
            border: 2px solid rgba(255, 255, 255, .45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .feedback {
            display: none;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 13px;
            margin-bottom: 16px;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
        }

        .feedback.show { display: block; }

        .feedback.info {
            background: var(--info-bg);
            border-color: var(--info-border);
            color: var(--info-text);
        }

        .feedback.success {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .feedback.error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .result-head h2 {
            margin: 0;
            font-size: 16px;
        }

        .result-head .meta {
            font-size: 12px;
            color: var(--text-sub);
        }

        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }

        th, td {
            padding: 11px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .3px;
            color: var(--text-sub);
            background: var(--head-bg);
            border-bottom: 1px solid var(--border);
        }

        tbody tr:nth-child(even) { background: var(--stripe); }
        tbody tr:hover { background: var(--primary-soft); }

        td.num { text-align: right; font-variant-numeric: tabular-nums; }

        .up { color: var(--up); }
        .down { color: var(--down); }

        .score {
            display: inline-block;
            min-width: 46px;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--info-bg);
            color: var(--info-text);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .score-good { background: var(--success-bg); color: var(--success-text); }
        .score-mid  { background: #fffbeb; color: #b45309; }
        .score-low  { background: var(--error-bg); color: var(--error-text); }

        .watchlist-card { margin-top: 16px; }
        .watch-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .watch-head h3 { margin: 0; font-size: 14px; }
        .watch-actions { display: flex; gap: 8px; }
        .watch-hint { font-size: 12px; color: var(--text-sub); margin: 0 0 8px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px 5px 12px;
            background: var(--primary-soft);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            transition: transform .12s, border-color .15s, background .15s;
        }
        .chip:hover {
            border-color: var(--primary);
            background: var(--info-bg);
            transform: translateY(-1px);
        }
        .chip .del {
            border: 0;
            background: transparent;
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1;
            padding: 0 4px;
            cursor: pointer;
            border-radius: 50%;
        }
        .chip .del:hover { color: var(--error-text); background: var(--error-bg); }
        .watch-empty { font-size: 13px; color: var(--text-sub); padding: 6px 0; }

        .reason {
            white-space: normal;
            min-width: 180px;
            color: var(--text-sub);
            font-size: 13px;
        }

        .empty {
            padding: 32px 12px;
            text-align: center;
            color: var(--text-sub);
            font-size: 13px;
        }

        .skeleton {
            height: 14px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--stripe) 25%, var(--border) 37%, var(--stripe) 63%);
            background-size: 400% 100%;
            animation: shimmer 1.2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        @media (max-width: 640px) {
            body { padding: 16px 12px 32px; }
            .card { padding: 16px; }
            .field { flex: 1 1 100%; }
            .actions { width: 100%; }
            .actions button { flex: 1; }
            header h1 { font-size: 20px; }
            .watch-head { flex-direction: column; align-items: flex-start; gap: 8px; }
            .watch-actions { width: 100%; }
            .watch-actions button { flex: 1; }
            th, td { padding: 9px 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>实时选股助手</h1>
        <p>输入股票代码，实时拉取行情（价格 / PE / PB / ROE）并按规则打分排序。</p>
    </header>

    <div class="card">
        <div class="form-row">
            <div class="field">
                <label for="codes">股票代码（逗号分隔，可多只）</label>
                <input id="codes" type="text"
                       placeholder="如 600519,000651,300750"
                       value="600519,000651,601318">
            </div>
            <div class="field">
                <label for="limit">返回条数</label>
                <input id="limit" type="number" min="1" max="100" step="1" value="5"
                       placeholder="请输入 1-100 之间的整数">
            </div>
            <div class="actions">
                <button id="submitBtn" class="btn-primary" type="button">实时选股</button>
                <button id="resetBtn" class="btn-ghost" type="button">重置</button>
            </div>
        </div>
    </div>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

    <div class="card">
        <div class="result-head">
            <h2>选股结果</h2>
            <span id="resultMeta" class="meta"></span>
        </div>
        <div id="resultBody" class="table-wrap">
            <div class="empty">尚未查询，点击「实时选股」获取结果。</div>
        </div>
    </div>

    <div class="card watchlist-card">
        <div class="watch-head">
            <h3>自选股</h3>
            <div class="watch-actions">
                <button id="saveWatchBtn" class="btn-ghost" type="button">保存当前为自选</button>
                <button id="clearWatchBtn" class="btn-ghost" type="button">清空自选</button>
            </div>
        </div>
        <p class="watch-hint">点击自选代码将其填入输入框并立即查询，可删除单只。</p>
        <div id="watchChips" class="chips"></div>
    </div>

<script>
    (function () {
        var API = '/api/stocks/pick';

        var codesInput = document.getElementById('codes');
        var limitInput = document.getElementById('limit');
        var submitBtn = document.getElementById('submitBtn');
        var resetBtn = document.getElementById('resetBtn');
        var feedback = document.getElementById('feedback');
        var resultBody = document.getElementById('resultBody');
        var resultMeta = document.getElementById('resultMeta');

        var watchChips = document.getElementById('watchChips');
        var saveWatchBtn = document.getElementById('saveWatchBtn');
        var clearWatchBtn = document.getElementById('clearWatchBtn');

        var loading = false;
        var WATCH_KEY = 'stockPickerWatchlist';

        function loadWatchlist() {
            try {
                var raw = JSON.parse(localStorage.getItem(WATCH_KEY) || '[]');
                return Array.isArray(raw) ? raw : [];
            } catch (e) {
                return [];
            }
        }

        function saveWatchlist(list) {
            try {
                localStorage.setItem(WATCH_KEY, JSON.stringify(list));
            } catch (e) { /* 存储不可用时静默降级 */ }
        }

        function renderWatchlist() {
            var list = loadWatchlist();
            if (list.length === 0) {
                watchChips.innerHTML = '<span class="watch-empty">暂无自选，输入代码后点「保存当前为自选」。</span>';
                return;
            }
            watchChips.innerHTML = list.map(function (code) {
                return '<span class="chip" data-code="' + escapeHtml(code) + '">'
                    + escapeHtml(code)
                    + '<button class="del" type="button" title="删除" data-del="' + escapeHtml(code) + '">×</button>'
                    + '</span>';
            }).join('');
        }

        function setFeedback(type, message) {
            feedback.className = 'feedback show ' + type;
            feedback.textContent = message;
        }

        function clearFeedback() {
            feedback.className = 'feedback';
            feedback.textContent = '';
        }

        function setLoading(value) {
            loading = value;
            submitBtn.disabled = value;
            resetBtn.disabled = value;
            codesInput.disabled = value;
            limitInput.disabled = value;
            submitBtn.innerHTML = value
                ? '<span class="spinner"></span>查询中…'
                : '实时选股';
        }

        function showSkeleton() {
            var rows = '';
            for (var i = 0; i < 3; i++) {
                rows += '<tr><td colspan="9"><div class="skeleton"></div></td></tr>';
            }
            resultBody.innerHTML = '<table><tbody>' + rows + '</tbody></table>';
            resultMeta.textContent = '';
        }

        function showEmpty(message) {
            resultBody.innerHTML = '<div class="empty">' + message + '</div>';
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function fmt(value, digits) {
            return Number(value).toFixed(digits === undefined ? 2 : digits);
        }

        function renderRows(list) {
            var html = '<table><thead><tr>'
                + '<th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th>'
                + '<th>PE</th><th>PB</th><th>ROE(%)</th><th>数据状态</th><th>评分 / 理由</th>'
                + '</tr></thead><tbody>';

            list.forEach(function (item) {
                var s = item.stock || {};
                var change = Number(s.changePercent);
                var changeClass = change > 0 ? 'up' : (change < 0 ? 'down' : '');
                var sign = change > 0 ? '+' : '';
                var meta = Number(s.roe) > 0 ? '实时' : '实时(无ROE)';
                var score = Number(item.score);
                var scoreClass = score >= 45 ? 'score-good' : (score >= 30 ? 'score-mid' : 'score-low');

                html += '<tr>'
                    + '<td>' + escapeHtml(s.code) + '</td>'
                    + '<td>' + escapeHtml(s.name) + '</td>'
                    + '<td class="num">' + fmt(s.price) + '</td>'
                    + '<td class="num ' + changeClass + '">' + sign + fmt(change) + '%</td>'
                    + '<td class="num">' + fmt(s.pe) + '</td>'
                    + '<td class="num">' + fmt(s.pb) + '</td>'
                    + '<td class="num">' + fmt(s.roe) + '</td>'
                    + '<td>' + escapeHtml(meta) + '</td>'
                    + '<td class="reason"><span class="score ' + scoreClass + '">' + fmt(score)
                    + '</span> ' + escapeHtml(item.reason) + '</td>'
                    + '</tr>';
            });

            html += '</tbody></table>';
            resultBody.innerHTML = html;
        }

        function validate() {
            var rawLimit = limitInput.value.trim();
            var rawCodes = codesInput.value.trim();
            if (rawCodes === '') {
                return { ok: false, message: '请输入至少一个股票代码。' };
            }
            var codeList = rawCodes.split(/[,，\s]+/).filter(Boolean);
            var bad = codeList.filter(function (c) {
                return !/^\d{6}$/.test(c);
            });
            if (bad.length > 0) {
                return { ok: false, message: '以下代码无效（需 6 位数字）：' + bad.join('、') };
            }
            if (rawLimit === '') {
                return { ok: false, message: '请输入返回条数。' };
            }
            var limit = Number(rawLimit);
            if (!Number.isInteger(limit) || limit < 1 || limit > 100) {
                return { ok: false, message: '返回条数需为 1-100 之间的整数。' };
            }
            return { ok: true, limit: limit, codes: codeList };
        }

        function submit() {
            if (loading) {
                return;
            }

            var check = validate();
            if (!check.ok) {
                setFeedback('error', check.message);
                return;
            }

            setLoading(true);
            clearFeedback();
            setFeedback('info', '正在拉取实时行情并打分…');
            showSkeleton();

            var query = 'limit=' + encodeURIComponent(check.limit)
                + '&codes=' + encodeURIComponent(check.codes.join(','));

            fetch(API + '?' + query)
                .then(function (res) {
                    if (!res.ok) {
                        throw new Error('服务返回异常状态：HTTP ' + res.status);
                    }
                    return res.json();
                })
                .then(function (data) {
                    if (!Array.isArray(data)) {
                        throw new Error('返回数据格式不符合预期。');
                    }

                    var now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                    if (data.length === 0) {
                        showEmpty('未获取到行情数据，请检查股票代码是否有效。');
                        resultMeta.textContent = '查询时间 ' + now;
                        setFeedback('info', '接口未返回有效行情数据。');
                        return;
                    }

                    renderRows(data);
                    resultMeta.textContent = '共 ' + data.length + ' 只 · 查询时间 ' + now;
                    setFeedback('success', '实时查询成功，共返回 ' + data.length + ' 只股票。');
                })
                .catch(function (err) {
                    showEmpty('查询失败，请稍后重试。');
                    resultMeta.textContent = '';
                    setFeedback('error', '查询失败：' + (err && err.message ? err.message : '未知错误'));
                })
                .finally(function () {
                    setLoading(false);
                });
        }

        function reset() {
            if (loading) {
                return;
            }
            codesInput.value = '600519,000651,601318';
            limitInput.value = '5';
            clearFeedback();
            resultMeta.textContent = '';
            showEmpty('尚未查询，点击「实时选股」获取结果。');
            codesInput.focus();
        }

        submitBtn.addEventListener('click', submit);
        resetBtn.addEventListener('click', reset);

        codesInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                submit();
            }
        });
        limitInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                submit();
            }
        });

        saveWatchBtn.addEventListener('click', function () {
            if (loading) {
                return;
            }
            var rawCodes = codesInput.value.trim();
            if (!rawCodes) {
                setFeedback('error', '请先在输入框中填写要保存的股票代码。');
                return;
            }
            var codeList = rawCodes.split(/[,，\s]+/).filter(Boolean);
            var bad = codeList.filter(function (c) { return !/^\d{6}$/.test(c); });
            if (bad.length > 0) {
                setFeedback('error', '以下代码无效，无法保存：' + bad.join('、'));
                return;
            }
            var list = loadWatchlist();
            codeList.forEach(function (c) {
                if (list.indexOf(c) === -1) {
                    list.push(c);
                }
            });
            saveWatchlist(list);
            renderWatchlist();
            setFeedback('success', '已保存 ' + codeList.length + ' 只自选股。');
        });

        clearWatchBtn.addEventListener('click', function () {
            if (loading) {
                return;
            }
            if (loadWatchlist().length === 0) {
                setFeedback('info', '自选列表已是空的。');
                return;
            }
            if (!window.confirm('确定清空全部自选股吗？')) {
                return;
            }
            saveWatchlist([]);
            renderWatchlist();
            setFeedback('info', '已清空自选股。');
        });

        watchChips.addEventListener('click', function (e) {
            var delBtn = e.target.closest('.del');
            if (!delBtn) {
                var chip = e.target.closest('.chip');
                if (chip && !loading) {
                    codesInput.value = chip.getAttribute('data-code');
                    submit();
                }
                return;
            }
            if (loading) {
                return;
            }
            var code = delBtn.getAttribute('data-del');
            var list = loadWatchlist().filter(function (c) { return c !== code; });
            saveWatchlist(list);
            renderWatchlist();
            setFeedback('info', '已从自选删除 ' + code + '。');
        });

        renderWatchlist();
    })();
</script>
</body>
</html>
