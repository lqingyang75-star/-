server:
  # 8080 已被本机代理占用，统一使用 8082
  port: 8082

spring:
  application:
    name: stock-picker
  profiles:
    # 默认走 mysql；没有 MySQL 环境时可用 --spring.profiles.active=dev 退回 H2
    active: mysql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# JWT 配置：secret 至少 32 字节，生产环境请用环境变量覆盖
app:
  jwt:
    secret: ${JWT_SECRET:stock-picker-assess-secret-key-please-change-in-prod-0123456789}
    expire-minutes: 120

---
# ============ 本地开发：H2 文件库，零安装即可运行 ============
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/assessdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  file:
    name: logs/app.log
  level:
    com.example.stockpicker: info

---
# ============ 验收环境：MySQL 8，切 profile 即可 ============
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:assess_finance}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    # 密码不写进版本库，启动时用环境变量 DB_PASSWORD 传入
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 首次建表用 update，表结构稳定后建议改为 validate
      ddl-auto: update
    open-in-view: false

logging:
  file:
    name: logs/app.log
  level:
    com.example.stockpicker: info
